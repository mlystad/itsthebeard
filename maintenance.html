<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>It's The Beard — Back Shortly</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --ink:       #0e0b07;
      --parchment: #f5efe3;
      --amber:     #c8882a;
      --amber-lt:  #e6a93e;
      --cream:     #ede5d2;
      --gold:      #d4a843;
    }

    html, body {
      height: 100%;
    }

    body {
      background-color: var(--ink);
      color: var(--parchment);
      font-family: 'Crimson Text', Georgia, serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 2rem;
    }

    .logo {
      font-family: 'Cinzel', serif;
      font-size: clamp(1.1rem, 3vw, 1.4rem);
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--amber);
      margin-bottom: 3rem;
      opacity: 0.85;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 2.5rem;
      width: 100%;
      max-width: 320px;
    }

    .divider hr {
      flex: 1;
      border: none;
      border-top: 1px solid rgba(200,136,42,0.35);
    }

    .divider-diamond {
      width: 6px;
      height: 6px;
      background: var(--amber);
      transform: rotate(45deg);
      flex-shrink: 0;
    }

    .gear-icon {
      width: 64px;
      height: 64px;
      margin-bottom: 2rem;
      color: var(--amber);
      animation: spin 8s linear infinite;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

    h1 {
      font-family: 'Cinzel', serif;
      font-size: clamp(2rem, 6vw, 3.2rem);
      font-weight: 700;
      letter-spacing: 0.06em;
      color: var(--parchment);
      line-height: 1.15;
      margin-bottom: 1.25rem;
    }

    h1 span {
      color: var(--amber);
    }

    p {
      font-size: clamp(1.05rem, 2.5vw, 1.25rem);
      line-height: 1.7;
      color: var(--cream);
      max-width: 480px;
      opacity: 0.85;
    }

    .badge {
      display: inline-block;
      margin-top: 2.5rem;
      padding: 0.45rem 1.2rem;
      border: 1px solid rgba(200,136,42,0.4);
      border-radius: 2px;
      font-family: 'Cinzel', serif;
      font-size: 0.7rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--amber);
      opacity: 0.75;
    }
  </style>
</head>
<body>

  <div class="logo">It's The Beard</div>

  <div class="divider">
    <hr />
    <div class="divider-diamond"></div>
    <hr />
  </div>

  <svg class="gear-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z"/>
    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/>
  </svg>

  <h1>We'll be back <span>shortly.</span></h1>

  <p>We're making some updates to the site. Check back soon — the brotherhood isn't going anywhere.</p>

  <div class="badge">Maintenance in progress</div>

</body>
</html>
